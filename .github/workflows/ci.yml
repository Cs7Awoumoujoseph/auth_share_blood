name: Auth Share Blood CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blood_share
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blood_share"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/blood_share
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MAIL_USERNAME: ci@example.test
      MAIL_PASS: ci-test-placeholder-not-for-production
      JWT_SECRET: ci-only-signing-secret-with-sufficient-length-123456789
      JWT_EXPIRATION: 3600000
      APP_SECRET_GOVPASS: ci-test-placeholder-not-for-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Grant execute permission to Maven wrapper
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw --batch-mode test

      - name: Package application
        run: ./mvnw --batch-mode package -DskipTests
